<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#030712"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="url(#grad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="12" fill="url(#grad)" filter="url(#glow)"/>
  <text x="50" y="55" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">JL</text>
</svg>
